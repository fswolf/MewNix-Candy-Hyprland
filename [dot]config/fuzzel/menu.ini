[main]
include=~/.config/fuzzel/mewnix-colors.ini
font = JetBrainsMono Nerd Font:size=13
dpi-aware = no
icon-theme = BeautyLine
icons-enabled = yes
show-actions = no
terminal = kitty

keyboard-focus = on-demand
exit-on-keyboard-focus-loss = yes

width = 18
horizontal-pad = 18
vertical-pad = 12
inner-pad = 12
line-height = 38

layer = overlay


[border]
width = 2
radius = 12

