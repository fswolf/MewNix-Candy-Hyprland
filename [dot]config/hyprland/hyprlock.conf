# ==========================
# Hyprlock - MewNix Candy
# ==========================


# ==========================
# Backgrounds
# ==========================

background {
    monitor = DP-1
    path = /home/ryan/Pictures/backgrounds/Goth/01.png

    blur_passes = 0
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

background {
    monitor = HDMI-A-1
    path = /home/ryan/Pictures/backgrounds/Fill/darkblue.png
}

# ==========================
# Main Glass Panel
# ==========================

shape {
    monitor = DP-1

    size = 400, 320
    color = rgba(18, 12, 28, 0.62)

    rounding = 28

    border_size = 1
    border_color = rgba(200, 165, 235, 0.48)

    position = 0, 0
    halign = center
    valign = center
}

# ==========================
# Outer Avatar Glow
# ==========================

shape {
    monitor = DP-1

    size = 108, 108
    color = rgba(200, 165, 235, 0.12)

    rounding = 999

    border_size = 1
    border_color = rgba(245, 190, 255, 0.35)

    position = 0, 75
    halign = center
    valign = center
}

# ==========================
# Avatar Circle
# ==========================

shape {
    monitor = DP-1

    size = 90, 90
    color = rgba(30, 18, 45, 0.90)

    rounding = 999

    border_size = 2
    border_color = rgba(245, 190, 255, 0.85)

    position = 0, 75
    halign = center
    valign = center
}


# ==========================
# User Icon
# ==========================

label {
    monitor = DP-1

    text = 
    color = rgba(245, 190, 255, 1.0)

    font_size = 42
    font_family = Symbols Nerd Font

    position = 0, 75
    halign = center
    valign = center
}


# ==========================
# Username
# ==========================

label {
    monitor = DP-1

    text = $USER
    color = rgba(250, 240, 255, 1.0)

    font_size = 24
    font_family = JetBrainsMono Nerd Font

    position = 0, -10
    halign = center
    valign = center
}


# ==========================
# Password Field
# ==========================

input-field {
    monitor = DP-1

    size = 280, 52

    outline_thickness = 2

    dots_size = 0.28
    dots_spacing = 0.18
    dots_center = true

    outer_color = rgba(220, 175, 250, 0.78)
    inner_color = rgba(18, 12, 28, 0.88)
    font_color = rgba(245, 190, 255, 0.95)

    fade_on_empty = true
    placeholder_text = <i>Password</i>
    hide_input = false

    rounding = 18

    position = 0, -80
    halign = center
    valign = center
}


# ==========================
# Clock
# ==========================

label {
    monitor = DP-1

    text = $TIME
    color = rgba(245, 238, 250, 0.70)

    font_size = 56
    font_family = JetBrainsMono Nerd Font

    position = 0, 230
    halign = center
    valign = center
}


# ==========================
# Bottom Buttons
# ==========================

# Shutdown
label {
    monitor = DP-1

    text = 
    color = rgba(245, 190, 255, 0.90)

    font_size = 28
    font_family = Symbols Nerd Font

    position = -120, -230
    halign = center
    valign = center

    onclick = systemctl poweroff
}

# Reboot
label {
    monitor = DP-1

    text = 
    color = rgba(245, 190, 255, 0.90)

    font_size = 28
    font_family = Symbols Nerd Font

    position = -40, -230
    halign = center
    valign = center

    onclick = systemctl reboot
}

# Logout
label {
    monitor = DP-1

    text = 󰍃
    color = rgba(245, 190, 255, 0.90)

    font_size = 28
    font_family = Symbols Nerd Font

    position = 40, -230
    halign = center
    valign = center

    onclick = loginctl terminate-session $XDG_SESSION_ID
}

# Turn Displays Off
label {
    monitor = DP-1

    text = 󰤄
    color = rgba(245, 190, 255, 0.90)

    font_size = 28
    font_family = Symbols Nerd Font

    position = 120, -230
    halign = center
    valign = center

    onclick = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
}