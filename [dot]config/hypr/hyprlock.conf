source = ~/.config/hypr/hyprlock-wallpapers.conf
source = ~/.config/hypr/hyprlock-theme.conf

# ==========================
# Hyprlock - MewNix Candy
# ==========================


# ==========================
# Backgrounds
# ==========================

background {
    monitor = DP-1
    path = $mewnix_wallpaper_main

    blur_passes = 0
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

background {
    monitor = HDMI-A-1
    path = $mewnix_wallpaper_portrait
}

# ==========================
# Main Glass Panel
# ==========================

shape {
    monitor = DP-1

    size = 400, 320
    color = $mewnix_lock_0

    rounding = 28

    border_size = 1
    border_color = $mewnix_lock_1

    position = 0, 0
    halign = center
    valign = center
}

# ==========================
# Outer Avatar Glow
# ==========================

shape {
    monitor = DP-1

    size = 108, 108
    color = $mewnix_lock_2

    rounding = 999

    border_size = 1
    border_color = $mewnix_lock_3

    position = 0, 75
    halign = center
    valign = center
}

# ==========================
# Avatar Circle
# ==========================

shape {
    monitor = DP-1

    size = 90, 90
    color = $mewnix_lock_4

    rounding = 999

    border_size = 2
    border_color = $mewnix_lock_5

    position = 0, 75
    halign = center
    valign = center
}


# ==========================
# User Icon
# ==========================

label {
    monitor = DP-1

    text = 
    color = $mewnix_lock_6

    font_size = 42
    font_family = Symbols Nerd Font

    position = 0, 75
    halign = center
    valign = center
}


# ==========================
# Username
# ==========================

label {
    monitor = DP-1

    text = $USER
    color = $mewnix_lock_7

    font_size = 24
    font_family = JetBrainsMono Nerd Font

    position = 0, -10
    halign = center
    valign = center
}


# ==========================
# Password Field
# ==========================

input-field {
    monitor = DP-1

    size = 280, 52

    outline_thickness = 2

    dots_size = 0.28
    dots_spacing = 0.18
    dots_center = true

    outer_color = $mewnix_lock_8
    inner_color = $mewnix_lock_9
    font_color = $mewnix_lock_10

    fade_on_empty = true
    placeholder_text = <i>Password</i>
    hide_input = false

    rounding = 18

    position = 0, -80
    halign = center
    valign = center
}


# ==========================
# Clock
# ==========================

label {
    monitor = DP-1

    text = $TIME
    color = $mewnix_lock_11

    font_size = 56
    font_family = JetBrainsMono Nerd Font

    position = 0, 230
    halign = center
    valign = center
}


# ==========================
# Bottom Buttons
# ==========================

# Shutdown
label {
    monitor = DP-1

    text = 
    color = $mewnix_lock_12

    font_size = 28
    font_family = Symbols Nerd Font

    position = -120, -230
    halign = center
    valign = center

    onclick = systemctl poweroff
}

# Reboot
label {
    monitor = DP-1

    text = 
    color = $mewnix_lock_12

    font_size = 28
    font_family = Symbols Nerd Font

    position = -40, -230
    halign = center
    valign = center

    onclick = systemctl reboot
}

# Logout
label {
    monitor = DP-1

    text = 󰍃
    color = $mewnix_lock_12

    font_size = 28
    font_family = Symbols Nerd Font

    position = 40, -230
    halign = center
    valign = center

    onclick = loginctl terminate-session $XDG_SESSION_ID
}

# Turn Displays Off
label {
    monitor = DP-1

    text = 󰤄
    color = $mewnix_lock_12

    font_size = 28
    font_family = Symbols Nerd Font

    position = 120, -230
    halign = center
    valign = center

    onclick = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
}