[main]
font = JetBrainsMono Nerd Font:size=13
dpi-aware = no
icons-enabled = no
show-actions = no
terminal = kitty

keyboard-focus = on-demand
exit-on-keyboard-focus-loss = yes

width = 12
horizontal-pad = 14
vertical-pad = 8
inner-pad = 4
line-height = 24

layer = overlay

[colors]
background = 1c0e28f5
text = e8e0f0ff
match = f5c2e7ff
selection = b48cdcee
selection-text = 1c0e28ff
selection-match = f5c2e7ff
border = b48cdc99

[border]
width = 2
radius = 12
