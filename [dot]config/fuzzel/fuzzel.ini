[main]
include=~/.config/fuzzel/mewnix-colors.ini
font = JetBrainsMono Nerd Font:size=13
dpi-aware = no
prompt = "   "
icon-theme = BeautyLine
icons-enabled = yes
show-actions = no
terminal = kitty

keyboard-focus = on-demand
exit-on-keyboard-focus-loss = yes

width = 45
lines = 12
horizontal-pad = 16
vertical-pad = 12
inner-pad = 8
line-height = 22

# Positioning
anchor = top-left
x-margin = 6
y-margin = 6
layer = overlay


[border]
width = 2
radius = 12
